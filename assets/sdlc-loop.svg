<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="200" viewBox="0 0 1100 200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#9B5CFF"/>
      <stop offset="100%" stop-color="#FF4D6D"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .bg{fill:#070b18}
      .title{fill:#e5e7eb;font-family:JetBrains Mono,ui-monospace,monospace;font-size:16px;font-weight:800}
      .sub{fill:#9ca3af;font-family:JetBrains Mono,ui-monospace,monospace;font-size:11px}
      .box{fill:#0b1020;stroke:url(#g);stroke-width:2.2;rx:16;filter:url(#glow)}
      .t{fill:#e5e7eb;font-family:JetBrains Mono,ui-monospace,monospace;font-size:13px;font-weight:800}
      .s{fill:#9ca3af;font-family:JetBrains Mono,ui-monospace,monospace;font-size:11px}
      .loop{stroke:url(#g);stroke-width:4;stroke-linecap:round;stroke-dasharray:16 12;filter:url(#glow);animation:dash 2.2s linear infinite}
      .arrow{fill:url(#g);filter:url(#glow);animation:blink 1.8s ease-in-out infinite}
      @keyframes dash { to { stroke-dashoffset: -56; } }
      @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }
    </style>
  </defs>

  <rect class="bg" width="1100" height="200" rx="22"/>
  <text x="28" y="40" class="title">SDLC LOOP — plan → code → build → test → release → deploy → operate → secure</text>
  <text x="28" y="60" class="sub">Shows end-to-end ownership: PRs, CI gates, releases, rollouts, SLOs, security, incident response.</text>

  <g transform="translate(28,82)">
    <rect class="box" x="0"   y="0" width="120" height="62"/>
    <text class="t" x="18" y="30">PLAN</text><text class="s" x="18" y="50">design</text>

    <rect class="box" x="145" y="0" width="120" height="62"/>
    <text class="t" x="163" y="30">CODE</text><text class="s" x="163" y="50">PRs</text>

    <rect class="box" x="290" y="0" width="120" height="62"/>
    <text class="t" x="308" y="30">BUILD</text><text class="s" x="308" y="50">CI</text>

    <rect class="box" x="435" y="0" width="120" height="62"/>
    <text class="t" x="453" y="30">TEST</text><text class="s" x="453" y="50">gates</text>

    <rect class="box" x="580" y="0" width="120" height="62"/>
    <text class="t" x="598" y="30">RELEASE</text><text class="s" x="598" y="50">version</text>

    <rect class="box" x="725" y="0" width="120" height="62"/>
    <text class="t" x="743" y="30">DEPLOY</text><text class="s" x="743" y="50">rollout</text>

    <rect class="box" x="870" y="0" width="120" height="62"/>
    <text class="t" x="888" y="30">SECURE</text><text class="s" x="888" y="50">trust</text>
  </g>

  <!-- animated connectors -->
  <line class="loop" x1="148" y1="126" x2="165" y2="126"/>
  <line class="loop" x1="293" y1="126" x2="310" y2="126"/>
  <line class="loop" x1="438" y1="126" x2="455" y2="126"/>
  <line class="loop" x1="583" y1="126" x2="600" y2="126"/>
  <line class="loop" x1="728" y1="126" x2="745" y2="126"/>
  <line class="loop" x1="873" y1="126" x2="890" y2="126"/>

  <!-- blinking arrows -->
  <polygon class="arrow" points="170,126 160,120 160,132"/>
  <polygon class="arrow" points="315,126 305,120 305,132"/>
  <polygon class="arrow" points="460,126 450,120 450,132"/>
  <polygon class="arrow" points="605,126 595,120 595,132"/>
  <polygon class="arrow" points="750,126 740,120 740,132"/>
  <polygon class="arrow" points="895,126 885,120 885,132"/>
</svg>
