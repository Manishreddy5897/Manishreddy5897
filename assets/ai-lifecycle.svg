<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="55%" stop-color="#7AF7A6"/>
      <stop offset="100%" stop-color="#FF4D6D"/>
    </linearGradient>

    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .bg { fill: #070b18; }
      .box { fill:#0b1020; stroke:url(#g2); stroke-width:2; rx:18; filter:url(#glow2); }
      .title { fill:#e5e7eb; font-family:JetBrains Mono, monospace; font-size:15px; font-weight:700; }
      .sub { fill:#9ca3af; font-family:JetBrains Mono, monospace; font-size:11px; }
      .pipe { stroke:url(#g2); stroke-width:3; stroke-dasharray:12 10; animation: flow 2.5s linear infinite; filter:url(#glow2); }
      @keyframes flow { to { stroke-dashoffset:-44; } }
    </style>
  </defs>

  <rect class="bg" width="1100" height="220" rx="20"/>

  <text x="26" y="34" class="title">
    AI LIFECYCLE — signals → learning → inference → systems → observe → trust
  </text>

  <g transform="translate(26,64)">
    <rect class="box" width="155" height="78"/>
    <text class="title" x="18" y="32">DATA</text>
    <text class="sub" x="18" y="54">ingest • quality</text>

    <rect class="box" x="185" width="155" height="78"/>
    <text class="title" x="203" y="32">LEARNING</text>
    <text class="sub" x="203" y="54">train • eval</text>

    <rect class="box" x="370" width="155" height="78"/>
    <text class="title" x="388" y="32">INFERENCE</text>
    <text class="sub" x="388" y="54">latency • cost</text>

    <rect class="box" x="555" width="155" height="78"/>
    <text class="title" x="573" y="32">SYSTEMS</text>
    <text class="sub" x="573" y="54">APIs • pipelines</text>

    <rect class="box" x="740" width="155" height="78"/>
    <text class="title" x="758" y="32">OBSERVE</text>
    <text class="sub" x="758" y="54">metrics • traces</text>

    <rect class="box" x="925" width="155" height="78"/>
    <text class="title" x="943" y="32">TRUST</text>
    <text class="sub" x="943" y="54">security • audit</text>
  </g>

  <line class="pipe" x1="181" y1="104" x2="200" y2="104"/>
  <line class="pipe" x1="366" y1="104" x2="385" y2="104"/>
  <line class="pipe" x1="551" y1="104" x2="570" y2="104"/>
  <line class="pipe" x1="736" y1="104" x2="755" y2="104"/>
  <line class="pipe" x1="921" y1="104" x2="940" y2="104"/>
</svg>
