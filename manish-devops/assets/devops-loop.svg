<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Animated DevOps Infinity Loop</title>
  <desc id="desc">Static infinity loop with centered Dev and Ops labels and continuously moving DevOps words around each loop.</desc>

  <defs>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5a8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="leftLoop" d="M 230 210 a 190 135 0 1 1 380 0 a 190 135 0 1 1 -380 0"/>
    <path id="rightLoop" d="M 590 210 a 190 135 0 1 1 380 0 a 190 135 0 1 1 -380 0"/>
  </defs>

  <rect width="1200" height="420" fill="#061014"/>
  <rect x="18" y="18" width="1164" height="384" rx="22" fill="#08161b" stroke="#12303a" stroke-width="2"/>

  <g fill="none" stroke="url(#loopGrad)" stroke-width="24" stroke-linecap="round" filter="url(#softGlow)">
    <use href="#leftLoop"/>
    <use href="#rightLoop"/>
  </g>

  <text x="420" y="225" text-anchor="middle" dominant-baseline="middle" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="84" font-weight="800" fill="#d4fff2" opacity="0.92">Dev</text>
  <text x="780" y="225" text-anchor="middle" dominant-baseline="middle" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="84" font-weight="800" fill="#d1f8ff" opacity="0.92">Ops</text>

  <text font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="28" font-weight="700" fill="#b9ffe9" letter-spacing="1">
    <textPath href="#leftLoop" startOffset="0%">
      plan • code • build • test • plan • code • build • test •
      <animate attributeName="startOffset" from="0%" to="-50%" dur="12s" repeatCount="indefinite" calcMode="linear"/>
    </textPath>
  </text>

  <text font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="28" font-weight="700" fill="#b8f6ff" letter-spacing="1">
    <textPath href="#rightLoop" startOffset="0%">
      release • deploy • operate • monitor • release • deploy • operate • monitor •
      <animate attributeName="startOffset" from="0%" to="50%" dur="12s" repeatCount="indefinite" calcMode="linear"/>
    </textPath>
  </text>
</svg>
