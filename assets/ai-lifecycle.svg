<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#9B5CFF"/>
      <stop offset="100%" stop-color="#FF4D6D"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .bg{fill:#070b18}
      .title{fill:#e5e7eb;font-family:JetBrains Mono,ui-monospace,monospace;font-size:16px;font-weight:800;letter-spacing:0.3px}
      .sub{fill:#9ca3af;font-family:JetBrains Mono,ui-monospace,monospace;font-size:11px}
      .node{fill:#0b1020;stroke:url(#g);stroke-width:2.2;rx:18;filter:url(#glow)}
      .nodeText{fill:#e5e7eb;font-family:JetBrains Mono,ui-monospace,monospace;font-size:13px;font-weight:800}
      .nodeSub{fill:#9ca3af;font-family:JetBrains Mono,ui-monospace,monospace;font-size:11px}
      .pipe{stroke:url(#g);stroke-width:4;stroke-linecap:round;stroke-dasharray:18 12;filter:url(#glow);animation:flow 2.4s linear infinite}
      .dot{fill:url(#g);filter:url(#glow);animation:pulse 1.8s ease-in-out infinite}
      @keyframes flow { to { stroke-dashoffset: -60; } }
      @keyframes pulse { 0%,100%{opacity:.25; transform:translate(0,0)} 50%{opacity:1} }
    </style>
  </defs>

  <rect class="bg" width="1100" height="240" rx="22"/>
  <text x="28" y="40" class="title">AI LIFECYCLE — signals → learning → inference → systems → observe → trust</text>
  <text x="28" y="60" class="sub">End-to-end SDLC for production AI: data quality, evaluation, latency/cost, reliability, security, auditability.</text>

  <!-- nodes -->
  <g transform="translate(28,88)">
    <rect class="node" x="0"   y="0" width="160" height="88"/>
    <text class="nodeText" x="18" y="34">DATA</text>
    <text class="nodeSub"  x="18" y="58">ingest • quality • lineage</text>

    <rect class="node" x="188" y="0" width="160" height="88"/>
    <text class="nodeText" x="206" y="34">LEARNING</text>
    <text class="nodeSub"  x="206" y="58">train • eval • drift</text>

    <rect class="node" x="376" y="0" width="160" height="88"/>
    <text class="nodeText" x="394" y="34">INFERENCE</text>
    <text class="nodeSub"  x="394" y="58">latency • cost • scale</text>

    <rect class="node" x="564" y="0" width="160" height="88"/>
    <text class="nodeText" x="582" y="34">SYSTEMS</text>
    <text class="nodeSub"  x="582" y="58">APIs • pipelines • CI/CD</text>

    <rect class="node" x="752" y="0" width="160" height="88"/>
    <text class="nodeText" x="770" y="34">OBSERVE</text>
    <text class="nodeSub"  x="770" y="58">metrics • logs • traces</text>

    <rect class="node" x="940" y="0" width="160" height="88"/>
    <text class="nodeText" x="958" y="34">TRUST</text>
    <text class="nodeSub"  x="958" y="58">security • audit • RBAC</text>
  </g>

  <!-- animated pipes -->
  <line class="pipe" x1="196" y1="132" x2="216" y2="132"/>
  <line class="pipe" x1="384" y1="132" x2="404" y2="132"/>
  <line class="pipe" x1="572" y1="132" x2="592" y2="132"/>
  <line class="pipe" x1="760" y1="132" x2="780" y2="132"/>
  <line class="pipe" x1="948" y1="132" x2="968" y2="132"/>

  <!-- pulsing dots -->
  <circle class="dot" cx="206" cy="132" r="5"/>
  <circle class="dot" cx="394" cy="132" r="5"/>
  <circle class="dot" cx="582" cy="132" r="5"/>
  <circle class="dot" cx="770" cy="132" r="5"/>
  <circle class="dot" cx="958" cy="132" r="5"/>
</svg>
